<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 95 1200 875" role="img" aria-labelledby="arch-title arch-desc"><title id="arch-title">Final homelab architecture</title><desc id="arch-desc">Windows 11 sends events to Wazuh on Ubuntu. Ubuntu hosts the Wazuh central components, Hermes Agent, Ollama and Sentinel. Only the MCP server is shown in a Docker Compose boundary. MCP connects to the Wazuh API; Hermes uses MCP and Ollama and exchanges messages with Discord. Wazuh queries VirusTotal by file hash. Sentinel forwards selected alerts to Notion. Ollama provides a cloud model and a local backup.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#a4b0a2"/></marker><linearGradient id="heat-bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#21162f"/><stop offset="48%" stop-color="#132334"/><stop offset="100%" stop-color="#11342c"/></linearGradient><linearGradient id="heat-host" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#211b33"/><stop offset="52%" stop-color="#182a3b"/><stop offset="100%" stop-color="#1c3d35"/></linearGradient><linearGradient id="heat-node" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#3d2857"/><stop offset="48%" stop-color="#203e5b"/><stop offset="100%" stop-color="#245944"/></linearGradient><linearGradient id="heat-ext" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#30213f"/><stop offset="55%" stop-color="#203750"/><stop offset="100%" stop-color="#244d3c"/></linearGradient><linearGradient id="heat-mcp" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#553577"/><stop offset="52%" stop-color="#265a73"/><stop offset="100%" stop-color="#367758"/></linearGradient></defs><style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#f1f3ef;font-size:31px;font-weight:600}.sub{fill:#a6afa4;font-size:16px}.host{fill:url(#heat-host);stroke:#65728b;stroke-width:1.4}.node{fill:url(#heat-node);stroke:#87a1b5;stroke-width:1.4}.ext{fill:url(#heat-ext);stroke:#8498ad;stroke-width:1.4}.docker{fill:url(#heat-mcp);stroke:#a5e6b2;stroke-width:1.4}.heading{fill:#eff4ec;font-size:21px;font-weight:600}.body{fill:#d5dce5;font-size:16px}.small{fill:#c4cdd9;font-size:14px}.eyebrow{fill:#b6f0d8;font-size:12px;font-weight:600;letter-spacing:1.5px}.edge{fill:none;stroke:#a4b0a2;stroke-width:1.4;marker-end:url(#arrow)}</style><rect width="1200" height="1020" fill="#000000"/><rect x="30" y="110" width="250" height="210" rx="10" class="host"/><text x="50" y="147" class="heading">Windows 11</text><text x="50" y="173" class="small">VM 01 · Monitored endpoint</text><rect x="50" y="205" width="210" height="88" rx="10" class="node"/><text x="66" y="237" class="heading">Wazuh agent</text><text x="66" y="263" class="small">Events · FIM · inventory</text><rect x="340" y="110" width="830" height="640" rx="10" class="host"/><text x="370" y="147" class="heading">Ubuntu</text><text x="370" y="173" class="small">VM 02 · Shared private network</text><rect x="370" y="190" width="300" height="110" rx="10" class="node"/><text x="390" y="221" class="heading">Wazuh central services</text><text x="390" y="248" class="body">Manager · Indexer · Dashboard</text><text x="390" y="275" class="small">Rules · CIS checks · Vulnerabilities</text><path d="M262 245L368 245" class="edge"/><text x="315" y="230" class="small" text-anchor="middle">Events</text><rect x="30" y="380" width="250" height="130" rx="10" class="ext"/><text x="50" y="411" class="eyebrow">EXTERNAL SERVICE</text><text x="50" y="442" class="heading">VirusTotal</text><text x="50" y="469" class="body">File-hash reputation</text><text x="50" y="493" class="small">HTTPS API</text><path d="M370 275L310 275L310 445L282 445" class="edge" marker-start="url(#arrow)"/><rect x="370" y="380" width="300" height="130" rx="10" class="docker"/><text x="390" y="410" class="eyebrow">DOCKER COMPOSE</text><text x="390" y="445" class="heading">MCP server</text><text x="390" y="471" class="body">Wazuh tools · HTTP 3000</text><text x="390" y="496" class="small">API credentials from .env</text><path d="M520 378L520 302" class="edge" marker-start="url(#arrow)"/><text x="532" y="336" class="small">Wazuh API · HTTPS 55000</text><text x="532" y="358" class="small">Username/password → JWT</text><rect x="800" y="380" width="340" height="130" rx="10" class="node"/><text x="820" y="414" class="heading">Hermes Agent</text><text x="820" y="444" class="body">Tool calls and investigation summaries</text><text x="820" y="476" class="small">Ollama as the model provider</text><path d="M798 466L672 466" class="edge" marker-start="url(#arrow)"/><text x="735" y="426" class="small" text-anchor="middle">MCP HTTP</text><text x="735" y="448" class="small" text-anchor="middle">3000</text><rect x="370" y="600" width="300" height="110" rx="10" class="node"/><text x="390" y="634" class="heading">Sentinel · Python</text><text x="390" y="660" class="body">Reads Wazuh alerts.json</text><text x="390" y="686" class="small">Forwards rule.level ≥ 10</text><path d="M405 302L405 340L354 340L354 655L368 655" class="edge"/><rect x="800" y="600" width="340" height="110" rx="10" class="node"/><text x="820" y="634" class="heading">Ollama</text><text x="820" y="660" class="body">qwen3.5:4b · Local backup</text><text x="820" y="686" class="small">Cloud model selected as primary</text><path d="M970 512L970 598" class="edge" marker-start="url(#arrow)"/><text x="982" y="550" class="small">Ollama API</text><text x="982" y="573" class="small">HTTP 11434</text><rect x="30" y="600" width="250" height="110" rx="10" class="ext"/><text x="50" y="634" class="heading">Notion</text><text x="50" y="661" class="body">Tickets and case notes</text><text x="50" y="686" class="small">HTTPS API</text><path d="M368 655L282 655" class="edge"/><rect x="370" y="840" width="300" height="110" rx="10" class="ext"/><text x="390" y="873" class="heading">Ollama cloud</text><text x="390" y="900" class="body">gemma4:31b-cloud</text><text x="390" y="927" class="small">Remote inference · HTTPS</text><path d="M970 712L970 790L520 790L520 838" class="edge" marker-start="url(#arrow)"/><rect x="800" y="840" width="340" height="110" rx="10" class="ext"/><text x="820" y="873" class="heading">Discord</text><text x="820" y="900" class="body">SOC requests and summaries</text><text x="820" y="927" class="small">Hermes messaging integration</text><path d="M1142 445L1185 445L1185 895L1142 895" class="edge" marker-start="url(#arrow)"/></svg>
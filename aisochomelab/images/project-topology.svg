<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 665" role="img" aria-labelledby="title desc">
<title id="title">Windows 11 and Ubuntu: homelab architecture</title><desc id="desc">Project architecture with Windows 11 on the left and Ubuntu on the right. The Windows Wazuh agent forwards events to Wazuh on Ubuntu. Hermes accesses the MCP service over HTTP on port 3000. MCP reaches the Wazuh API over HTTPS on port 55000. Ollama provides its local HTTP API on port 11434, with Gemma 4 cloud and Qwen 3.5 local models. Wazuh queries the external VirusTotal API over HTTPS on port 443. Sentinel forwards selected alerts to the external Notion API over HTTPS on port 443. Hermes connects to Discord for user requests and SOC summaries.</desc>
<defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto-start-reverse"><path d="M0 0L6 3L0 6" fill="#9ca3af"/></marker></defs>
